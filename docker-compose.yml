services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: valve_stiction
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - timescaledb

  # Stateless predictor (classic detector + RF model) -- no DB access, see
  # docs/V3_PLAN.md. ingestion persists the result after this returns.
  detection:
    build:
      context: .
      dockerfile: detection/Dockerfile
    environment:
      DETECTION_SERVICE_PORT: "50051"
    ports:
      - "50051:50051"

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    environment:
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_TOPIC: valve/data
      DETECTION_SERVICE_ADDR: detection:50051
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/valve_stiction
      WINDOW_STRIDE: "25"
    depends_on:
      mosquitto:
        condition: service_started
      detection:
        condition: service_started
      timescaledb:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/valve_stiction
      BACKEND_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      timescaledb:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_TOPIC: valve/data
      SENSOR_ID: valve-1
      STICTION_ENABLED: "true"
    depends_on:
      - mosquitto

  # Multi-sensor load test (V1_PLAN.md deferred item): same shared topic,
  # sensor_id in the payload distinguishes them -- this is V1's existing
  # architecture doing double duty as a concurrency test, not V2's FR-7/
  # FR-8 (per-sensor MQTT topics bridged into Kafka/Redpanda, a separate,
  # larger piece of scope). One sensor healthy, one stuck -- if ingestion's
  # per-sensor buffering or detection's per-sensor activity reference ever
  # leaked state across sensors, this is what would catch it.
  simulator-2:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_TOPIC: valve/data
      SENSOR_ID: valve-2
      STICTION_ENABLED: "false"
    depends_on:
      - mosquitto

  simulator-3:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_TOPIC: valve/data
      SENSOR_ID: valve-3
      STICTION_ENABLED: "true"
    depends_on:
      - mosquitto

volumes:
  timescaledb-data:
